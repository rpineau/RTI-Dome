openapi: 3.2.0

info:
  title: RTI-Zone Dome API
  version: 1.0.0
  description: This API describes communications with the RTI-Zone dome server.
  contact:
    name: RTI-Zone
    url: https://rti-zone.org/
externalDocs:
  description: Find out more about the RTI-Zone dome controller
  url: https://rti-zone.org/astro_dome_control.php
servers:
- url: http://{host}/
  description: hostname or ip address of dome controller
  variables:
    host:
      default: 192.168.1.9
      description: The hostname or ip address.
paths:
  /setup/homePosition:
    get:
      summary: Get the controller home position
      description: 'Retrieve the controller home position.'
      operationId: getHomePosition
      responses:
        '200':
          description: Position successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions
    put:
      summary: Set the controller home position
      description: 'Set the controller home position which is then used to properly
        calculate azimuth to motor step position.'
      operationId: setHomePosition
      responses:
        '200':
          description: Position successfully set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: number
                  format: float
              required:
              - value

  /setup/parkPosition:
    get:
      summary: Get the controller park position
      description: 'Retrieve the controller park position.'
      operationId: getParkPosition
      responses:
        '200':
          description: Position successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions
    put:
      summary: Set the controller park position
      description: 'Set the controller park position.'
      operationId: setParkPosition
      responses:
        '200':
          description: Position successfully set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: number
                  format: float
              required:
              - value

  /setup/reverseDirection:
    get:
      summary: Get the controller default rotation direction
      description: 'Retrieve the controller rotation direction.'
      operationId: getReverseDirection
      responses:
        '200':
          description: Direction successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions
    put:
      summary: Set the controller direction, normal or reversed
      description: 'Set the controller direction, normal or reversed.'
      operationId: setReverseDirection
      responses:
        '200':
          description: Direction successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: boolean
              required:
              - value

  /setup/useDHCP:
    get:
      summary: Get the controller DHCP setting
      description: 'Retrieve the controller DHCP setting.'
      operationId: getDHCPEnabled
      responses:
        '200':
          description: DHCP value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the controller DHCP setting
      description: 'Set the controller DHCP setting.'
      operationId: setDHCPEnabled
      responses:
        '200':
          description: DHCP successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: boolean
              required:
              - value

  /setup/macAddress:
    get:
      summary: Get the controller MAC Address
      description: 'Retrieve the controller MAC Address.'
      operationId: getMACAddress
      responses:
        '200':
          description: MAC Address value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking

  /setup/ipAddress:
    get:
      summary: Get the controller IP Address
      description: 'Retrieve the controller IP Address.'
      operationId: getIpAddress
      responses:
        '200':
          description: IP Address value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the controller IP Address
      description: 'Set the controller IP Address.'
      operationId: setIpAddress
      responses:
        '200':
          description: IP Address successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
              - value

  /setup/subnetMask:
    get:
      summary: Get the controller subnet mask
      description: 'Retrieve the controller subnet mask.'
      operationId: getSubnetMask
      responses:
        '200':
          description: Subnet mask value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the controller subnet mask
      description: 'Set the controller subnet mask.'
      operationId: setSubnetMask
      responses:
        '200':
          description: Subnet mask successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
              - value

  /setup/ipGateway:
    get:
      summary: Get the controller gateway IP
      description: 'Retrieve the controller gateway IP.'
      operationId: getGatewayIP
      responses:
        '200':
          description: Gateway IP value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the controller gateway IP
      description: 'Set the controller gateway IP.'
      operationId: setGatewayIP
      responses:
        '200':
          description: Gateway IP successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
              - value

  /setup/restoreNetworkDefaults:
    put:
      summary: Reset all network configs to their defaults value
      description: 'Reset all network configs to their defaults values for Ethernet and Wifi.'
      operationId: setNetworkDefaults
      responses:
        '200':
          description: Shutter controller network settings successfully reset to default
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking

  /setup/domeCalibrate:
    get:
      summary: Get the controller calibration status
      description: 'Retrieve the controller calibration status.'
      operationId: getCalibrationStatus
      responses:
        '200':
          description: Calibration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calibration'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: Start or stop calibration
      description: 'Start or stop the controller calibration.'
      operationId: setCalibrationStatus
      responses:
        '200':
          description: Calibration state successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  $ref: '#/components/schemas/CalibrationAction'
              required:
              - value

  /setup/stepPerRevolution:
    get:
      summary: Get the controller steps per revolution
      description: 'Retrieve the controller steps per revolution.'
      operationId: getStepPerRev
      responses:
        '200':
          description: Controller steps per revolution
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: set the controller steps per revolution
      description: 'Set the controller steps per revolution.'
      operationId: setStepPerRev
      responses:
        '200':
          description: Controller steps per revolution successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: integer
              required:
              - value

  /setup/rotationSpeed:
    get:
      summary: Get the controller rotation speed
      description: 'Retrieve the controller rotation speed in step per second.'
      operationId: getRotationSpeed
      responses:
        '200':
          description: Controller rotation speed in step per second
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: set the controller rotation speed in step per second
      description: 'Set the controller rotation speed ins step per second.'
      operationId: setRotationSpeed
      responses:
        '200':
          description: Controller rotation speed successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: integer
              required:
              - value

  /setup/rotationAcceleration:
    get:
      summary: Get the controller rotation acceleration
      description: 'Retrieve the controller rotation acceleration in step per second
        per second.'
      operationId: getRotationAcceleration
      responses:
        '200':
          description: Controller rotation acceleration in step per second per second
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: set the controller rotation acceleration in step per second per second
      description: 'Set the controller rotation acceleration ins step per second per
        second.'
      operationId: setRotationAcceleration
      responses:
        '200':
          description: Controller rotation acceleration successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: integer
              required:
              - value

  /setup/restoreRotationMotorSettings:
    put:
      summary: set the controller motor settings back to default
      description: 'Set the controller motor settings back to default.'
      operationId: setRotationMotorDefault
      responses:
        '200':
          description: Controller motor settings successfully reset to default
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller

  /setup/unsafeDomeAction:
    get:
      summary: Get the controller action in case of an unsafe weather condition
      description: 'Retrieve the controller action in case of an unsafe weather condition.'
      operationId: getUnsafeAction
      responses:
        '200':
          description: Controller action in case of an unsafe weather condition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: set the controller action in case of an unsafe weather condition
      description: 'Set the controller action in case of an unsafe weather condition.'
      operationId: setUnsafeAction
      responses:
        '200':
          description: Controller Action to take in case of an unsafe weather condition
            successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  $ref: '#/components/schemas/UnsafeAction'
              required:
              - value

  /setup/envCondition:
    get:
      summary: Get the controller weather condition
      description: 'Retrieve the controller weather condition based on sensor pin
        value.'
      operationId: getEnvCondition
      responses:
        '200':
          description: Controller weather condition
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller

  /setup/shutterOpenOrder:
    get:
      summary: Get the shutter controller open order if a drop off shutter is present
      description: 'Retrieve the shutter controller open order if a drop off shutter
        is present.'
      operationId: getShutterOpenOrder
      responses:
        '200':
          description: Shutter controller open order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShuterOpenOrder'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
    put:
      summary: set the controller open order if a drop off shutter is present
      description: 'Set the controller  open order if a drop off shutter is present.'
      operationId: setShutterOpenOrder
      responses:
        '200':
          description: Shutter Open order successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  $ref: '#/components/schemas/ShuterOpenOrder'
              required:
              - value

  /setup/wifiSSID:
    get:
      summary: Get the shutter controller WiFi SSID used to communicate with the shutter
      description: 'Retrieve the controller WiFi SSID used to communicate with the
        shutter.'
      operationId: getShutterWiFiSSID
      responses:
        '200':
          description: Shutter controller SSID
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
    put:
      summary: set the controller WiFi SSID used to communicate with the shutter
      description: 'Set the controller WiFi SSID used to communicate with the shutter.'
      operationId: setShutterWiFiSSID
      responses:
        '200':
          description: Shutter Open order successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
              - value

  /setup/shutterPresentState:
    get:
      summary: Get the shutter present status
      description: 'Retrieve the controller shutter present status'
      operationId: getShutterPresent
      responses:
        '200':
          description: Shutter controller present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutterPresent'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

  /setup/shutterSpeed:
    get:
      summary: Get the shutter controller speed
      description: 'Retrieve the shutter controller speed in step per second.'
      operationId: getShutterSpeed
      responses:
        '200':
          description: Shutter controller speed in step per second
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
    put:
      summary: set the shutter controller speed in step per second
      description: 'Set the shutter controller speed ins step per second.'
      operationId: setShutterSpeed
      responses:
        '200':
          description: Shutter controller speed successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: integer
              required:
              - value

  /setup/shutterAcceleration:
    get:
      summary: Get the shutter controller acceleration
      description: 'Retrieve the shutter controller acceleration in step per second
        per second.'
      operationId: getShutterAcceleration
      responses:
        '200':
          description: Shutter controller acceleration in step per second per second
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
    put:
      summary: set the shutter controller acceleration in step per second per second
      description: 'Set the shutter controller acceleration ins step per second per
        second.'
      operationId: setShutterAcceleration
      responses:
        '200':
          description: Shutter controller acceleration successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: integer
              required:
              - value

  /setup/restoreShutterMotorSettings:
    put:
      summary: set the shutter controller motor settings back to default
      description: 'Set the shutter controller motor settings back to default.'
      operationId: setShutterMotorDefault
      responses:
        '200':
          description: Shutter controller motor settings successfully reset to default
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

  /setup/shutterVoltageCutoff:
    get:
      summary: Get the shutter controller voltage cutoff
      description: 'Retrieve the shutter controller voltage cutoff.

        If the voltage get to this value or bellow, the shutter will close.'
      operationId: getShutterCutOff
      responses:
        '200':
          description: Shutter controller voltage cutoff
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
    put:
      summary: Set the shutter controller voltage cutoff
      description: 'Set the shutter controller voltage cutoff.

        If the voltage get to this value or bellow, the shutter will close.'
      operationId: setShutterCutOff
      responses:
        '200':
          description: Shutter controller voltage cutoff successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: integer
              required:
              - value

  /setup/shutterVoltage:
    get:
      summary: Get the shutter controller voltage
      description: 'Retrieve the shutter controller voltage.'
      operationId: getShutterVoltage
      responses:
        '200':
          description: Shutter controller voltage
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

  /setup/homeDome:
    put:
      summary: Home the dome
      description: 'This will send the dome to the home azimuth'
      operationId: homeDome
      responses:
        '200':
          description: Homing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomeStatus'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Dome Control

  /setup/parkDome:
    put:
      summary: Park the dome
      description: 'This will send the dome to the park azimuth'
      operationId: parkDome
      responses:
        '200':
          description: Parking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomeStatus'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Dome Control

  /setup/gotoAzimuth:
    put:
      summary: Got to the specified azimuth
      description: 'Go to the specified azimuth.'
      operationId: gotoAzimuth
      responses:
        '200':
          description: Position successfully set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomeStatus'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Dome Control
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: number
                  format: float
              required:
              - value

  /setup/getAzimuth:
    get:
      summary: Get the dome azimuth
      description: 'Retrieve the dome current azimuth in degrees'
      operationId: getAzimuth
      responses:
        '200':
          description: Position successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Dome Control

  /setup/openShutter:
    put:
      summary: Open the dome shutter(s)
      description: 'This will open the dome shutter(s)'
      operationId: openShutter
      responses:
        '200':
          description: Homing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutterStatus'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Dome Control

  /setup/closeShutter:
    put:
      summary: Close the dome shutter(s)
      description: 'This will close the dome shutter(s)'
      operationId: closeShutter
      responses:
        '200':
          description: Parking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutterStatus'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Dome Control

  /setup/getShutterState:
    get:
      summary: Get the shutter(s) state
      description: 'Retrieve the shutter(s) state'
      operationId: getShutterState
      responses:
        '200':
          description: Shutter state successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutterStatus'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Dome Control

components:
  schemas:
    Position:
      type: object
      properties:
        value:
          type: number
          format: float
          description: position in degrees
      required:
      - value

    ErrorCode:
      type: integer
      description: Error codes. Same as Alpaca
      enum:
      - 0
      - 1024
      - 1025
      - 1026
      - 1031
      - 1032
      - 1033
      - 1035
      - 1036

    CalibrationAction:
      type: string
      enum:
      - start
      - stop
      x-enum-varnames:
      - start
      - stop

    CalibrationStates:
      type: integer
      description: Calibration states
      enum:
      - 6
      - 8
      - 0
      x-enum-varnames:
      - CALIBRATING
      - MEASURING
      - IDLE
      x-enum-descriptions:
      - Controller is doing a rotation for step calibration
      - Controller is measuring number of steps per rotation.
      - Controller is idle.

    UnsafeAction:
      type: integer
      enum:
      - 0
      - 1
      - 2
      x-enum-varnames:
      - DO_NOTHING
      - HOME
      - PARK
      x-enum-descriptions:
      - Do nothing
      - Home dome
      - Park dome

    ShuterOpenOrder:
      type: integer
      enum:
      - 0
      - 1
      x-enum-varnames:
      - BOTTOM_FIRST
      - TOP_FIRST
      x-enum-descriptions:
      - Open bottom shutter first
      - Open top shutter first

    DomeStatus:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      x-enum-varnames:
      - MOVING
      - HOMING
      - PARKING
      - IDLE
      x-enum-descriptions:
      - Dome is slewing
      - Dome is homing
      - Dome is parking
      - dome is idle

    ShutterStatus:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      x-enum-varnames:
      - OPEN
      - CLOSED
      - OPENING
      - CLOSING
      - ERROR
      x-enum-descriptions:
      - Shutter is open
      - Shutter is closed
      - Shutter is opening
      - Shutter is closing
      - Shutter state is unknown

    Response400ErrorInfo:
      type: object
      properties:
        ErrorNumber:
          $ref: '#/components/schemas/ErrorCode'
        ErrorMessage:
          type: string
      required:
      - ErrorNumber
      - ErrorMessage

    Calibration:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/CalibrationStates'
      required:
      - value

    ShutterPresent:
      type: object
      properties:
        value:
          type: boolean
          description: shuter present true/falcse
      required:
      - value

  examples:
    ERROR_BUSY_SLEWING:
      value:
        ErrorNumber: 1035
        ErrorMessage: Controller is busy slewing to a new position.
      description: No Error
    ERROR_BUSY_CALIBRATING:
      value:
        ErrorNumber: 1035
        ErrorMessage: Controller is busy calibrating.
      description: Controller is busy

  responses:
    Response400:
      description: Dome controller error. Additional information encoded in the response
        content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response400ErrorInfo'
          examples:
            ERROR_BUSY_SLEWING:
