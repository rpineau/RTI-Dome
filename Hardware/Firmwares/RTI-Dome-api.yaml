openapi: 3.0.3

info:
  title: RTI-Zone Dome API
  version: 1.0.0
  description: This API describes communications with the RTI-Zone dome server.
  contact:
    name: RTI-Zone
    url: https://rti-zone.org/

externalDocs:
  description: Find out more about the RTI-Zone dome controller
  url: https://rti-zone.org/astro_dome_control.php

servers:
- url: http://{host}/
  description: hostname or ip address of dome controller
  variables:
    host:
      default: 192.168.0.99
      description: The hostname or ip address.

paths:
  /setup/homePosition:
    get:
      summary: Get the controller home position
      description: |
        Retrieve the controller home position.
      operationId: getHomePosition
      responses:
        '200':
          description: Position successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions
    put:
      summary: Set the controller home position
      description: |
        Set the controller home position which is then used to properly calculate
        azimuth to motor step position.
      operationId: setHomePosition
      parameters:
      - name: value
        in: query
        description: New home position azimuth in degrees
        required: true
        schema:
          type: number
          format: float
      responses:
        '200':
          description: Position successfully set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions

  /setup/parkPosition:
    get:
      summary: Get the controller park position
      description: |
        Retrieve the controller park position.
      operationId: getParkPosition
      responses:
        '200':
          description: Position successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions
    put:
      summary: Set the controller park position
      description: |
        Set the controller park position.
      operationId: setParkPosition
      parameters:
      - name: value
        in: query
        description: New park position azimuth in degrees
        required: true
        schema:
          type: number
          format: float
      responses:
        '200':
          description: Position successfully set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions

  /setup/reverseDirection:
    get:
      summary: Get the controller default rotation direction
      description: |
        Retrieve the controller rotation direction.
      operationId: getReverseDirection
      responses:
        '200':
          description: Direction successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions
    put:
      summary: Set the controller direction, normal or reversed
      description: |
        Set the controller direction, normal or reversed.
      operationId: setReverseDirection
      parameters:
      - name: value
        in: query
        description: reversed true or false
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: Direction successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Positions

  /setup/useDHCP:
    get:
      summary: Get the controller DHCP setting
      description: |
        Retrieve the controller DHCP setting.
      operationId: getDHCPEnabled
      responses:
        '200':
          description: DHCP value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the controller DHCP setting
      description: |
        Set the controller DHCP setting.
      operationId: setDHCPEnabled
      parameters:
      - name: value
        in: query
        description: DHCP enabled is true or false
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: DHCP successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking

  /setup/macAddress:
    get:
      summary: Get the controller MAC Address
      description: |
        Retrieve the controller MAC Address.
      operationId: getMACAddress
      responses:
        '200':
          description: MAC Address value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking

  /setup/ipAddress:
    get:
      summary: Get the controller IP Address
      description: |
        Retrieve the controller IP Address.
      operationId: getIpAddress
      responses:
        '200':
          description: IP Address value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the controller IP Address
      description: |
        Set the controller IP Address.
      operationId: setIpAddress
      parameters:
      - name: value
        in: query
        description: IP Address 
        required: true
        schema:
          type: string
      responses:
        '200':
          description: IP Address successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking

  /setup/subnetMask:
    get:
      summary: Get the controller subnet mask
      description: |
        Retrieve the controller subnet mask.
      operationId: getSubnetMask
      responses:
        '200':
          description: Subnet mask value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the controller subnet mask
      description: |
        Set the controller subnet mask.
      operationId: setSubnetMask
      parameters:
      - name: value
        in: query
        description: Subnet mask 
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subnet mask successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking

  /setup/ipGateway:
    get:
      summary: Get the controller gateway IP
      description: |
        Retrieve the controller gateway IP.
      operationId: getGatewayIP
      responses:
        '200':
          description: Gateway IP value successfully retrieved
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking
    put:
      summary: Set the controller gateway IP
      description: |
        Set the controller gateway IP.
      operationId: setGatewayIP
      parameters:
      - name: value
        in: query
        description: Gateway IP 
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Gateway IP successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Networking

  /setup/domeCalibrate:
    get:
      summary: Get the controller calibration status
      description: |
        Retrieve the controller calibration status.
      operationId: getCalibrationStatus
      responses:
        '200':
          description: Calibration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calibration'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: Start or stop calibration
      description: |
        Start or stop the controller calibration.
      operationId: setCalibrationStatus
      parameters:
      - name: value
        in: query
        description: Calibration 
        required: true
        schema:
          $ref: '#/components/schemas/CalibrationAction'
      responses:
        '200':
          description: Calibration state successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller

  /setup/stepPerRevolution:
    get:
      summary: Get the controller steps per revolution
      description: |
        Retrieve the controller steps per revolution.
      operationId: getStepPerRev
      responses:
        '200':
          description: Controller steps per revolution
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: set the controller steps per revolution
      description: |
        Set the controller steps per revolution.
      operationId: setStepPerRev
      parameters:
      - name: value
        in: query
        description: Controller steps per revolution 
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Controller steps per revolution successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller

  /setup/rotationSpeed:
    get:
      summary: Get the controller rotation speed
      description: |
        Retrieve the controller rotation speed in step per second.
      operationId: getRotationSpeed
      responses:
        '200':
          description: Controller rotation speed in step per second
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: set the controller rotation speed in step per second
      description: |
        Set the controller rotation speed ins step per second.
      operationId: setRotationSpeed
      parameters:
      - name: value
        in: query
        description: Controller rotation speed in step per second 
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Controller rotation speed successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller

  /setup/rotationAcceleration:
    get:
      summary: Get the controller rotation acceleration
      description: |
        Retrieve the controller rotation acceleration in step per second per second.
      operationId: getRotationAcceleration
      responses:
        '200':
          description: Controller rotation acceleration in step per second per second
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: set the controller rotation acceleration in step per second per second
      description: |
        Set the controller rotation acceleration ins step per second per second.
      operationId: setRotationAcceleration
      parameters:
      - name: value
        in: query
        description: Controller rotation acceleration in step per second per second 
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Controller rotation acceleration successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller

  /setup/restoreRotationMotorSettings:
    put:
      summary: set the controller motor settings back to default
      description: |
        Set the controller motor settings back to default.
      operationId: setRotationMotorDefault
      responses:
        '200':
          description: Controller motor settings successfully reset to default
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller

  /setup/unsafeDomeAction:
    get:
      summary: Get the controller action in case of an unsafe weather condition
      description: |
        Retrieve the controller action in case of an unsafe weather condition.
      operationId: getUnsafeAction
      responses:
        '200':
          description: Controller action in case of an unsafe weather condition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller
    put:
      summary: set the controller action in case of an unsafe weather condition
      description: |
        Set the controller action in case of an unsafe weather condition.
      operationId: setUnsafeAction
      parameters:
      - name: value
        in: query
        description: Action to take in case of an unsafe weather condition
        required: true
        schema:
          $ref: '#/components/schemas/UnsafeAction'
      responses:
        '200':
          description: Controller Action to take in case of an unsafe weather condition successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller

  /setup/envCondition:
    get:
      summary: Get the controller weather condition
      description: |
        Retrieve the controller weather condition based on sensor pin value.
      operationId: getEnvCondition
      responses:
        '200':
          description: Controller weather condition
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Rotation Controller

  /setup/shutterOpenOrder:
    get:
      summary: Get the shutter controller open order if a drop off shutter is present
      description: |
        Retrieve the shutter controller open order if a drop off shutter is present.
      operationId: getShutterOpenOrder
      responses:
        '200':
          description: Shutter controller open order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShuterOpenOrder'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
    put:
      summary: set the controller open order if a drop off shutter is present
      description: |
        Set the controller  open order if a drop off shutter is present.
      operationId: setShutterOpenOrder
      parameters:
      - name: value
        in: query
        description: Open order if a drop off shutter is present.
        required: true
        schema:
          $ref: '#/components/schemas/ShuterOpenOrder'
      responses:
        '200':
          description: Shutter Open order successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

  /setup/wifiSSID:
    get:
      summary: Get the shutter controller WiFi SSID used to communicate with the shutter
      description: |
        Retrieve the controller WiFi SSID used to communicate with the shutter.
      operationId: getShutterWiFiSSID
      responses:
        '200':
          description: Shutter controller SSID
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
    put:
      summary: set the controller WiFi SSID used to communicate with the shutter
      description: |
        Set the controller WiFi SSID used to communicate with the shutter.
      operationId: setShutterWiFiSSID
      parameters:
      - name: value
        in: query
        description: Open order if a drop off shutter is present.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Shutter Open order successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

  /setup/shutterPresentState:
    get:
      summary: Get the shutter present status
      description: |
        Retrieve the controller shutter present status
      operationId: getShutterPresent
      responses:
        '200':
          description: Shutter controller present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutterPresent'
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

  /setup/shutterSpeed:
    get:
      summary: Get the shutter controller speed
      description: |
        Retrieve the shutter controller speed in step per second.
      operationId: getShutterSpeed
      responses:
        '200':
          description: Shutter controller speed in step per second
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
    put:
      summary: set the shutter controller speed in step per second
      description: |
        Set the shutter controller speed ins step per second.
      operationId: setShutterSpeed
      parameters:
      - name: value
        in: query
        description: Shutter controller speed in step per second 
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Shutter controller speed successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

  /setup/shutterAcceleration:
    get:
      summary: Get the shutter controller acceleration
      description: |
        Retrieve the shutter controller acceleration in step per second per second.
      operationId: getShutterAcceleration
      responses:
        '200':
          description: Shutter controller acceleration in step per second per second
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller
    put:
      summary: set the shutter controller acceleration in step per second per second
      description: |
        Set the shutter controller acceleration ins step per second per second.
      operationId: setShutterAcceleration
      parameters:
      - name: value
        in: query
        description: Shutter controller acceleration in step per second per second 
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Shutter controller acceleration successfully set
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

  /setup/restoreShutterMotorSettings:
    put:
      summary: set the shutter controller motor settings back to default
      description: |
        Set the shutter controller motor settings back to default.
      operationId: setShutterMotorDefault
      responses:
        '200':
          description: Shutter controller motor settings successfully reset to default
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

  /setup/shutterVoltageCutoff:
      get:
        summary: Get the shutter controller voltage cutoff
        description: |
          Retrieve the shutter controller voltage cutoff.
          If the voltage get to this value or bellow, the shutter will close.
        operationId: getShutterCutOff
        responses:
          '200':
            description: Shutter controller voltage cutoff
          '400':
            $ref: '#/components/responses/Response400'
        tags:
        - Shutter Controller
      put:
        summary: Set the shutter controller voltage cutoff
        description: |
          Set the shutter controller voltage cutoff.
          If the voltage get to this value or bellow, the shutter will close.
        operationId: setShutterCutOff
        parameters:
        - name: value
          in: query
          description: Shutter controller voltage cutoff
          required: true
          schema:
            type: integer
        responses:
          '200':
            description: Shutter controller voltage cutoff successfully set
          '400':
            $ref: '#/components/responses/Response400'
        tags:
        - Shutter Controller

  /setup/shutterVoltage:
    get:
      summary: Get the shutter controller voltage
      description: |
        Retrieve the shutter controller voltage.
      operationId: getShutterVoltage
      responses:
        '200':
          description: Shutter controller voltage
        '400':
          $ref: '#/components/responses/Response400'
      tags:
      - Shutter Controller

components:
  schemas:
    Position:
      type: object
      properties:
        value:
          type: number
          format: float
          description: position in degrees
      required:
      - value

    ErrorCode:
      type: integer
      description: Error codes. Same as Alpaca
      enum:
      - 0
      - 1024
      - 1025
      - 1026
      - 1031
      - 1032
      - 1033
      - 1035
      - 1036

    CalibrationAction:
      type: string
      enum:
      - start
      - stop
      x-enum-varnames:
      - start
      - stop

    CalibrationStates:
      type: string
      description: Calibration states
      enum:
        - STEP1
        - MEASURING
        - NOT_CALIBRATING
      x-enum-varnames:
      - STEP1
      - MEASURING
      - NOT_CALIBRATING
      x-enum-descriptions:
      - Controller is doing a rotation for step calibration
      - Controller is measuring number of steps per rotation.
      - Controller is not calibrating.

    UnsafeAction:
      type: string
      enum:
      - DO_NOTHING
      - HOME
      - PARK
      x-enum-varnames:
      - DO_NOTHING
      - HOME
      - PARK

    ShuterOpenOrder:
      type: string
      enum:
      - BOTTOM_FIRST
      - TOP_FIRST
      x-enum-varnames:
      - BOTTOM_FIRST
      - TOP_FIRST

    Response400ErrorInfo:
      type: object
      properties:
        ErrorNumber:
          $ref: '#/components/schemas/ErrorCode'
        ErrorMessage:
          type: string
      required:
      - ErrorNumber
      - ErrorMessage

    Calibration:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/CalibrationStates'
      required:
      - value

    ShutterPresent:
      type: object
      properties:
        value:
          type: boolean
          description: shuter present true/falcse
      required:
      - value

  examples:
    ERROR_BUSY_SLEWING:
      value: { ErrorNumber: 1035, ErrorMessage: "Controller is busy slewing to a new position." }
      description: No Error
    ERROR_BUSY_CALIBRATING:
      value: { ErrorNumber: 1035, ErrorMessage: "Controller is busy calibrating." }
      description: Controller is busy

  responses:
    Response400:
      description: Dome controller error. Additional information encoded in the response content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response400ErrorInfo'
          examples:
            ERROR_BUSY_SLEWING:
              $ref: '#/components/examples/ERROR_BUSY_SLEWING'
            ERROR_BUSY_CALIBRATING:
              $ref: '#/components/examples/ERROR_BUSY_CALIBRATING'
